services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeup-postgres
    environment:
      POSTGRES_DB: tradeup
      POSTGRES_USER: tradeup
      POSTGRES_PASSWORD: tradeup
    ports:
      - '5432:5432'
    volumes:
      - tradeup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradeup -d tradeup']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeup-redis
    ports:
      - '6379:6379'
    volumes:
      - tradeup_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tradeup_pgdata:
  tradeup_redisdata:
