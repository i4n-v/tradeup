openapi: 3.1.0
info:
  title: Trade Up API — Mini Binance
  version: 1.0.0
  description: >
    Target contract for the Mini Binance MVP. Monetary values are exposed as decimal strings
    in JSON to preserve scale (BRL 2dp, BTC 8dp, price 2dp).

    BUY/SELL respond with **HTTP 202** and a **`PENDING`** transaction; the queue worker settles
    the trade (**`COMPLETED`** or **`FAILED`**). Run `composer run dev` (or `php artisan queue:work`)
    locally so jobs are processed.

    Balance sufficiency (BRL buy / BTC sell) is validated **before** enqueue; **HTTP 422** returns
    **`message`** and creates **no** transaction row.

    Insufficient funds: **422** with **no** row (precheck); race conditions may **`FAIL`** post-enqueue.

servers:
  - url: http://localhost:8000/api/v1
    description: Local (php artisan serve)
security:
  - sanctum: []
paths:
  /auth/register:
    post:
      summary: Register user and create initial wallet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created — no token returned; user must call /auth/login to obtain a token (FR-001a)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      summary: Login (token Sanctum)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      summary: Revoke current token
      responses:
        '204':
          description: No Content
  /me:
    get:
      summary: Authenticated user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /dashboard:
    get:
      summary: Balances + latest quote for home screen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /trades/buy:
    post:
      summary: Buy BTC with BRL (async settlement)
      description: >
        Returns **202** with **`status: PENDING`**. Settlement runs via queue worker (**`composer run dev`**
        locally). **Insufficient BRL**: **422** with **`message`**; **no** transaction row created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyRequest'
      responses:
        '202':
          description: Trade accepted — **`PENDING`** until worker settles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeAcceptedResponse'
        '422':
          description: Validation, insufficient funds, invalid amount (no transaction row persisted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /trades/sell:
    post:
      summary: Sell BTC for BRL (async settlement)
      description: >
        Returns **202** with **`status: PENDING`**. **Insufficient BTC**: **422** with **`message`**;
        **no** transaction row created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellRequest'
      responses:
        '202':
          description: Trade accepted — **`PENDING`** until worker settles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeAcceptedResponse'
        '422':
          description: Validation, insufficient funds, invalid amount (no transaction row persisted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /transactions:
    get:
      summary: User transaction history (newest first)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number (1-based)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Number of results per page (max 200)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
  /profile:
    patch:
      summary: Update name (email immutable in v1)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /profile/avatar:
    post:
      summary: Upload avatar (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    format: uri
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    ErrorBody:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterResponse:
      type: object
      description: Registration response — no Bearer token (FR-001a). Use /auth/login to obtain a token.
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
    DashboardResponse:
      type: object
      properties:
        brlBalance:
          type: string
          description: BRL balance (2dp string)
          example: '10000.00'
        btcBalance:
          type: string
          description: BTC balance (8dp string)
          example: '0.00000000'
        btcPriceBrl:
          type: string
          nullable: true
          description: Current BRL price per 1 BTC (2dp string), null if unavailable
          example: '250000.00'
        quoteAvailable:
          type: boolean
          description: False when btcPriceBrl is null
    BuyRequest:
      type: object
      required: [amountBrl]
      properties:
        amountBrl:
          type: string
          description: BRL amount to spend (2dp string)
          example: '100.00'
    SellRequest:
      type: object
      required: [amountBtc]
      properties:
        amountBtc:
          type: string
          description: BTC amount to sell (up to 8dp string)
          example: '0.01000000'
    TransactionStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED]
    TransactionFailureReason:
      type: string
      description: Present when status is FAILED; mapped to UX in the mobile client
      enum:
        - INSUFFICIENT_BRL_FUNDS
        - INSUFFICIENT_BTC_FUNDS
        - QUOTE_UNAVAILABLE
        - ZERO_RESULT
        - UNKNOWN
    Transaction:
      type: object
      properties:
        id:
          type: integer
          description: Primary key (**present** once the **PENDING** row is persisted)
        type:
          type: string
          enum: [BUY, SELL]
        status:
          $ref: '#/components/schemas/TransactionStatus'
        btcAmount:
          type: string
          description: BTC amount (8dp string); placeholder until **`COMPLETED`**
        brlAmount:
          type: string
          description: BRL amount (2dp string)
        btcPriceBrl:
          type: string
          description: Execution price BRL/BTC (**2dp**) when **`COMPLETED`**; **`0.00`** while **`PENDING`**
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 UTC with Z suffix (**row creation / initiation instant** while **`PENDING`**)
          example: '2026-05-17T17:30:45Z'
        failureReason:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TransactionFailureReason'
    TradeAcceptedResponse:
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
